<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareerPulse Job Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-icon">⚡</div>
            <span>CareerPulse</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="jobs.html">Find Jobs</a></li>
            <li><a href="applications.html">Applications</a></li>
            <li><a href="interviews.html">Interviews</a></li>
            <li><a href="candidate_dashboard.html">Candidate Portal</a></li>
            <li><a href="employer_dashboard.html">Employer Portal</a></li>
            <li><a href="admin_dashboard.html">Admin Dashboard</a></li>
        </ul>
        <div class="nav-actions">
            <div id="user-session-badge" class="user-badge">🌐 Guest</div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="main-container">
        <div class="form-card" style="max-width: 650px;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="font-size:1.8rem; font-weight:800; color:white;">Create New Account</h2>
                <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.4rem;">Choose your registration category below</p>
            </div>

            <!-- Tab Switcher -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; background:rgba(255,255,255,0.03); padding:0.4rem; border-radius:var(--radius-sm); margin-bottom:1.5rem;">
                <button type="button" id="tab-cand-btn" class="btn btn-primary btn-sm" style="justify-content:center;" onclick="showRegForm('candidate')">Candidate Registration</button>
                <button type="button" id="tab-emp-btn" class="btn btn-outline btn-sm" style="justify-content:center;" onclick="showRegForm('employer')">Employer Registration</button>
            </div>

            <!-- Candidate Registration Form -->
            <form id="candidate-reg-form">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>Candidate ID (Auto / Custom)</label>
                        <input type="number" id="cand-id" class="form-control" placeholder="103">
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="cand-name" class="form-control" placeholder="Rahul Sharma" required>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="cand-email" class="form-control" placeholder="rahul@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="cand-phone" class="form-control" placeholder="9876543210" required>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>Qualification</label>
                        <input type="text" id="cand-qualification" class="form-control" placeholder="B.Tech CSE" required>
                    </div>
                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="number" id="cand-exp" class="form-control" placeholder="2" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Skills (Comma Separated)</label>
                    <input type="text" id="cand-skills" class="form-control" placeholder="Python, Django, JavaScript" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="cand-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.8rem; margin-top:1rem;">
                    Register as Job Seeker &rarr;
                </button>
            </form>

            <!-- Employer Registration Form -->
            <form id="employer-reg-form" style="display:none;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>Employer ID (Auto / Custom)</label>
                        <input type="number" id="emp-id" class="form-control" placeholder="203">
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="emp-company" class="form-control" placeholder="Infosys" required>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>HR Contact Name</label>
                        <input type="text" id="emp-hr" class="form-control" placeholder="Priya Reddy" required>
                    </div>
                    <div class="form-group">
                        <label>HR Email Address</label>
                        <input type="email" id="emp-email" class="form-control" placeholder="hr@company.com" required>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="emp-phone" class="form-control" placeholder="9988776655" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="emp-location" class="form-control" placeholder="Bangalore" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Industry Category</label>
                    <input type="text" id="emp-industry" class="form-control" placeholder="Information Technology" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.8rem; margin-top:1rem;">
                    Register Organization &rarr;
                </button>
            </form>

            <div style="text-align:center; margin-top:1.5rem; color:var(--text-muted); font-size:0.9rem;">
                Already registered? <a href="login.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign In</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CareerPulse Job Portal Application</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function showRegForm(type) {
            if (type === 'candidate') {
                document.getElementById('candidate-reg-form').style.display = 'block';
                document.getElementById('employer-reg-form').style.display = 'none';
                document.getElementById('tab-cand-btn').className = 'btn btn-primary btn-sm';
                document.getElementById('tab-emp-btn').className = 'btn btn-outline btn-sm';
            } else {
                document.getElementById('candidate-reg-form').style.display = 'none';
                document.getElementById('employer-reg-form').style.display = 'block';
                document.getElementById('tab-cand-btn').className = 'btn btn-outline btn-sm';
                document.getElementById('tab-emp-btn').className = 'btn btn-primary btn-sm';
            }
        }

        // Candidate Submit
        document.getElementById('candidate-reg-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                candidate_id: document.getElementById('cand-id').value ? parseInt(document.getElementById('cand-id').value) : null,
                full_name: document.getElementById('cand-name').value,
                email: document.getElementById('cand-email').value,
                phone: document.getElementById('cand-phone').value,
                qualification: document.getElementById('cand-qualification').value,
                skills: document.getElementById('cand-skills').value,
                experience: parseInt(document.getElementById('cand-exp').value),
                password: document.getElementById('cand-password').value
            };
            const res = await API.addCandidate(payload);
            if (res.status === 'success') {
                setSession('candidate', res.candidate);
                showToast('Registration successful! Redirecting to dashboard...', 'success');
                setTimeout(() => { window.location.href = 'candidate_dashboard.html'; }, 1200);
            } else {
                showToast('Registration failed. ' + (res.error || ''), 'error');
            }
        };

        // Employer Submit
        document.getElementById('employer-reg-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                employer_id: document.getElementById('emp-id').value ? parseInt(document.getElementById('emp-id').value) : null,
                company_name: document.getElementById('emp-company').value,
                hr_name: document.getElementById('emp-hr').value,
                email: document.getElementById('emp-email').value,
                phone: document.getElementById('emp-phone').value,
                location: document.getElementById('emp-location').value,
                industry: document.getElementById('emp-industry').value
            };
            const res = await API.addEmployer(payload);
            if (res.status === 'success') {
                setSession('employer', res.employer);
                showToast('Employer profile registered! Redirecting...', 'success');
                setTimeout(() => { window.location.href = 'employer_dashboard.html'; }, 1200);
            } else {
                showToast('Employer registration failed.', 'error');
            }
        };
    </script>
</body>
</html>
